services:

  db:
    image: mysql:8.4
    container_name: moda-urbana-db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: moda_urbana
      MYSQL_USER: moda_user
      MYSQL_PASSWORD: moda_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: moda-urbana-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: moda_user
      DB_PASSWORD: moda_pass

volumes:
  mysql_data:
